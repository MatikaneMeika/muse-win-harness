  <rect width="1200" height="360" rx="24" fill="url(#coverBg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#1D1D1F" stroke-opacity="0.06"/>

  <g opacity="0.78" transform="translate(860, 88)">

    <rect x="2" y="14" width="3.5" height="16" rx="1.75" fill="#2B7FFF"/>
    <!-- SVG_LOGO (36x36 centred inside 44x44 -> translate(4,4) scale(0.3)) -->
    <g transform="translate(4, 4) scale(0.3)">
      <g transform="rotate(12 60 60)">
        <path d="M 30 80 C 40 20, 55 30, 55 60 C 55 90, 70 40, 75 30 C 80 20, 90 50, 95 45"

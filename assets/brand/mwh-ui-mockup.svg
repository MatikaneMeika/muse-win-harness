<svg width="1280" height="860" viewBox="0 0 1280 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mwhBlue" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B7FFF"/>
      <stop offset="100%" stop-color="#1B6FEF"/>
    </linearGradient>
    <filter id="panelShadow" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#111112" flood-opacity="0.14"/>
    </filter>
    <filter id="islandShadow" x="-10%" y="-10%" width="120%" height="124%">

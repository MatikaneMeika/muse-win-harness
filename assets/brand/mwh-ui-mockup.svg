<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="museBlueBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B7FFF"/>
      <stop offset="100%" stop-color="#1B6FEF"/>
    </linearGradient>
  </defs>

  <!-- Outer Desktop Window Frame (Frameless 32px Titlebar + Embedded View) -->
  <rect x="10" y="10" width="1180" height="660" rx="16" fill="url(#winBg)" stroke="#272B36" stroke-width="2"/>

  <!-- 32px Custom Chrome Titlebar -->
  <rect x="11" y="11" width="1178" height="36" rx="14" fill="#151820"/>
  <circle cx="32" cy="29" r="7" fill="#2B7FFF"/>
  <text x="48" y="33" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Muse-Win-Harness</text>
  <rect x="162" y="19" width="62" height="20" rx="6" fill="#2B7FFF" fill-opacity="0.15" stroke="#2B7FFF" stroke-opacity="0.35"/>
  <text x="174" y="33" fill="#8AB8FF" font-family="Consolas, monospace" font-size="11" font-weight="600">v0.1.0</text>

  <!-- Window Controls (Min / Max / Close) -->
  <line x1="1102" y1="29" x2="1112" y2="29" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="1132" y="24" width="10" height="10" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M 1162 24 L 1172 34 M 1172 24 L 1162 34" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Left Activity Rail (48px) -->
  <rect x="11" y="47" width="52" height="622" fill="#13161D"/>
  <line x1="63" y1="47" x2="63" y2="669" stroke="#222631" stroke-width="1"/>
  <!-- MWH Activity Slot Button (Active) -->
  <rect x="21" y="64" width="32" height="32" rx="9" fill="#2B7FFF" fill-opacity="0.18" stroke="#2B7FFF" stroke-width="1.5"/>
  <circle cx="37" cy="80" r="6" fill="#2B7FFF"/>
  <rect x="21" y="112" width="32" height="32" rx="9" fill="#1C2029"/>
  <rect x="21" y="156" width="32" height="32" rx="9" fill="#1C2029"/>

  <!-- Drawer Backdrop Overlay Hint -->
  <rect x="64" y="47" width="1125" height="622" fill="#07090D" fill-opacity="0.65"/>

  <!-- 1. Left MWH Settings Drawer (#mwh-drawer, 20px radius, 320px width) -->
  <g transform="translate(76, 62)">
    <rect x="0" y="0" width="320" height="468" rx="20" fill="#161922" stroke="#2B7FFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="22" y="34" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Muse-Win-Harness</text>
    <rect x="226" y="18" width="72" height="22" rx="11" fill="#10B981" fill-opacity="0.16"/>
    <circle cx="238" cy="29" r="3.5" fill="#10B981"/>
    <text x="247" y="33" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">宿主就绪</text>

    <!-- Quick Pairing Card -->
    <rect x="18" y="50" width="284" height="92" rx="12" fill="#10131A" stroke="#232836"/>
    <text x="32" y="72" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11.5">Cloudflare Quick Tunnel (HTTPS)</text>
    <text x="32" y="92" fill="#8AB8FF" font-family="Consolas, monospace" font-size="11">https://demo-tunnel.trycloudflare.com/mcp</text>
    <rect x="32" y="104" width="124" height="26" rx="7" fill="url(#museBlueBtn)"/>
    <text x="52" y="121" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">复制配对口令</text>
    <rect x="164" y="104" width="124" height="26" rx="7" fill="#1E2433" stroke="#2E364B"/>
    <text x="190" y="121" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">复制 Token</text>

    <!-- 4 Permission Modes Selector -->
    <text x="22" y="166" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">统一四档权限模式 (Permission Profile)</text>

    <rect x="18" y="176" width="284" height="46" rx="10" fill="#10131A" stroke="#232836"/>
    <text x="34" y="196" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">计划模式 (plan)</text>
    <text x="34" y="212" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">只读探查，拦截一切文件修改与写命令</text>

    <rect x="18" y="228" width="284" height="48" rx="10" fill="#17253B" stroke="#2B7FFF" stroke-width="1.5"/>
    <text x="34" y="248" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">变更前确认 (confirm · 默认)</text>
    <text x="34" y="264" fill="#8AB8FF" font-family="Segoe UI, sans-serif" font-size="11">读放行；写文件/命令/代理前浮岛确认+快照</text>

    <rect x="18" y="282" width="284" height="46" rx="10" fill="#10131A" stroke="#232836"/>
    <text x="34" y="302" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">自主模式 (autonomous)</text>
    <text x="34" y="318" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">工作区内常规读写自动快照放行，高危询问</text>

    <rect x="18" y="334" width="284" height="46" rx="10" fill="#10131A" stroke="#232836"/>
    <text x="34" y="354" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">完全访问 (full-access)</text>
    <text x="34" y="370" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">允许跨目录普通读写，破坏性操作仍强制审批</text>

    <!-- Open Advanced Subpanel Button -->
    <rect x="18" y="400" width="186" height="36" rx="10" fill="#1E2433" stroke="#2B7FFF" stroke-opacity="0.4"/>
    <text x="48" y="423" fill="#8AB8FF" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">打开高级配置中心 →</text>

    <!-- Emergency Kill Button -->
    <rect x="212" y="400" width="88" height="36" rx="10" fill="#3B1219" stroke="#EF4444" stroke-opacity="0.5"/>
    <text x="232" y="423" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">全局急停</text>
  </g>

  <!-- 2. Right 5-Tab Advanced Subpanel (#mwh-subpanel, 24px radius, 640px width) -->
  <g transform="translate(412, 62)">
    <rect x="0" y="0" width="756" height="468" rx="24" fill="#161922" stroke="#2B7FFF" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Equal-width 5-Column Tab Bar: 连接 | 权限 | 工作区 | 代理 | 审计 -->
    <rect x="20" y="18" width="716" height="40" rx="12" fill="#0F1219" stroke="#232836"/>
    <g font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="91" y="43" fill="#94A3B8">连接</text>
      <text x="234" y="43" fill="#94A3B8">权限</text>
      <text x="378" y="43" fill="#94A3B8">工作区</text>
      <rect x="452" y="22" width="140" height="32" rx="9" fill="url(#museBlueBtn)"/>
      <text x="522" y="43" fill="#FFFFFF">代理</text>
      <text x="665" y="43" fill="#94A3B8">审计</text>
    </g>

    <!-- Active Tab Content: ACP Agent Registry & Git Worktree Pool -->
    <rect x="20" y="72" width="716" height="176" rx="14" fill="#10131A" stroke="#232836"/>
    <text x="38" y="100" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">自定义 ACP 代理 (Agent Client Protocol)</text>
    <rect x="312" y="84" width="150" height="22" rx="11" fill="#2B7FFF" fill-opacity="0.15"/>
    <text x="324" y="99" fill="#8AB8FF" font-family="Consolas, monospace" font-size="11">JSON-RPC 2.0 stdio</text>
    <rect x="612" y="82" width="104" height="28" rx="8" fill="url(#museBlueBtn)"/>
    <text x="630" y="100" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">+ 添加代理</text>

    <!-- Sample ACP Profile Row (Mockup Only) -->
    <rect x="36" y="120" width="684" height="52" rx="10" fill="#161B26" stroke="#262F42"/>
    <circle cx="56" cy="146" r="5" fill="#10B981"/>
    <text x="72" y="142" fill="#F1F5F9" font-family="Consolas, monospace" font-size="13" font-weight="700">custom-acp-agent</text>
    <text x="72" y="160" fill="#64748B" font-family="Consolas, monospace" font-size="11">command: node ./agents/acp-runner.mjs --stdio · childMode &lt;= workspace-write</text>
    <rect x="628" y="132" width="74" height="26" rx="7" fill="#1E293B"/>
    <text x="644" y="149" fill="#8AB8FF" font-family="Segoe UI, sans-serif" font-size="11.5">已探测就绪</text>

    <!-- Worktree Isolation & Snapshot Folding Preview -->
    <rect x="20" y="262" width="716" height="186" rx="14" fill="#10131A" stroke="#232836"/>
    <text x="38" y="290" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Git Worktree 并发隔离分支池 &amp; 写前快照折叠树</text>
    <text x="38" y="310" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11.5">每个代理任务自动遵循铁律一 (ChildMode &lt;= ParentMode) 与铁律二 (独立 Worktree / Git Shadow Checkpoint)</text>

    <rect x="36" y="324" width="684" height="48" rx="10" fill="#161B26" stroke="#262F42"/>
    <text x="54" y="345" fill="#8AB8FF" font-family="Consolas, monospace" font-size="12" font-weight="600">C:\Workspace\DemoProject (2 snapshots)</text>
    <text x="54" y="362" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">chk_1794400000_demo01 · pre-approved-task · ASCII &amp; CJK files protected</text>
    <rect x="614" y="335" width="90" height="26" rx="7" fill="#1E293B" stroke="#2B7FFF" stroke-opacity="0.4"/>
    <text x="634" y="352" fill="#8AB8FF" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">一键回滚</text>

    <rect x="36" y="382" width="684" height="48" rx="10" fill="#161B26" stroke="#262F42"/>
    <text x="54" y="403" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">[ALLOW] fs_explore(read) -&gt; src/index.ts · mode=workspace-write</text>
    <text x="54" y="420" fill="#64748B" font-family="Consolas, monospace" font-size="11">audit.jsonl · secret tokens scrubbed ([REDACTED])</text>
  </g>

  <!-- 3. Bottom Real-time Approval Floating Island (#mwh-approval-island) -->
  <g transform="translate(270, 554)">
    <rect x="0" y="0" width="680" height="92" rx="22" fill="#141926" stroke="#2B7FFF" stroke-width="2"/>
    <!-- Rotating Single Gradient Ring Spinner -->
    <circle cx="42" cy="46" r="18" stroke="#1E293B" stroke-width="3.5" fill="none"/>
    <path d="M 42 28 A 18 18 0 0 1 60 46" stroke="#2B7FFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <text x="74" y="36" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">等待本地执行确认 · WAITING_APPROVAL</text>
    <rect x="328" y="20" width="76" height="20" rx="10" fill="#F59E0B" fill-opacity="0.18"/>
    <text x="342" y="34" fill="#FBBF24" font-family="Consolas, monospace" font-size="11" font-weight="700">MEDIUM</text>

    <text x="74" y="58" fill="#8AB8FF" font-family="Consolas, monospace" font-size="12">fs_mutate(write) -&gt; C:\Workspace\DemoProject\src\app.ts</text>
    <text x="74" y="76" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">批准后自动创建写前 Git Shadow 快照，Muse 经 job_control(poll) 秒级拉取 CONSUMED 回执</text>

    <!-- Action Buttons on Floating Island -->
    <rect x="442" y="28" width="96" height="36" rx="10" fill="url(#museBlueBtn)"/>
    <text x="466" y="51" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">允许一次</text>

    <rect x="546" y="28" width="64" height="36" rx="10" fill="#1E2433" stroke="#334155"/>
    <text x="565" y="51" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">拒绝</text>

    <rect x="618" y="28" width="46" height="36" rx="10" fill="#3B1219" stroke="#EF4444" stroke-opacity="0.5"/>
    <text x="629" y="51" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">强杀</text>
  </g>
</svg>

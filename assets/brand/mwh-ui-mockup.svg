  <!-- Frameless window (x=16, y=16, w=1248, h=828, rx=12) -->
  <rect x="16" y="16" width="1248" height="828" rx="12" fill="#F7F6F2"/>
  <rect x="16.5" y="16.5" width="1247" height="827" rx="11.5" stroke="#1D1D1F" stroke-opacity="0.08"/>

  <!-- 1. Custom Titlebar (shell/chrome.html: height 32px, y=16..48, #F4F4F5, 15px stroke logo) -->
  <path d="M 16 28 C 16 21.3726 21.3726 16 28 16 H 1252 C 1258.63 16 1264 21.3726 1264 28 V 48 H 16 V 28 Z" fill="#F4F4F5"/>
  <line x1="16" y1="48" x2="1264" y2="48" stroke="#000000" stroke-opacity="0.06"/>

  <!-- Titlebar Left Brand: padding-left 10px -> x=26, y=24.5 (15x15 SVG viewBox 0 0 120 120 -> scale 0.125) -->
  <g transform="translate(26, 24.5) scale(0.125)">
    <g transform="rotate(12 60 60)">
      <path d="M 30 80 C 40 20, 55 30, 55 60 C 55 90, 70 40, 75 30 C 80 20, 90 50, 95 45"
            fill="none" stroke="url(#mwhBlue)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="82" r="11" fill="url(#mwhBlue)"/>
    </g>
  </g>
  <text x="49" y="36.5" fill="#1A1A1A" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="-0.01em">Muse-Win-Harness</text>
  <rect x="168" y="23" width="48" height="18" rx="9" fill="#000000" fill-opacity="0.05" stroke="#000000" stroke-opacity="0.1"/>
  <text x="176" y="35.5" fill="#52525B" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="500">v0.1.0</text>

  <!-- Titlebar Right Window Controls (3 x 44px buttons: 1132..1176, 1176..1220, 1220..1264) -->
  <line x1="1149" y1="32" x2="1159" y2="32" stroke="#52525B" stroke-width="1.2"/>
  <rect x="1193.5" y="27.5" width="9" height="9" fill="none" stroke="#52525B" stroke-width="1.2"/>
  <path d="M 1237 27 L 1247 37 M 1247 27 L 1237 37" stroke="#52525B" stroke-width="1.2"/>

  <!-- 2. Muse.ai Client Area (y=48..844, height=796px) -->
  <!-- Left 56px Activity Rail (x=16..72, y=48..844) -->
  <path d="M 16 48 H 72 V 844 H 28 C 21.3726 844 16 838.627 16 832 V 48 Z" fill="#EFECE6"/>
  <line x1="72" y1="48" x2="72" y2="844" stroke="#000000" stroke-opacity="0.06"/>

  <!-- Host app top navigation placeholders (neutral, understated) -->
  <rect x="26" y="64" width="36" height="36" rx="10" fill="#000000" fill-opacity="0.05"/>
  <rect x="35" y="75" width="18" height="14" rx="3" fill="none" stroke="#63636A" stroke-width="1.6"/>
  <rect x="26" y="112" width="36" height="36" rx="10" fill="#000000" fill-opacity="0.03"/>
  <circle cx="44" cy="130" r="7" fill="none" stroke="#63636A" stroke-width="1.6"/>


        <circle cx="88" cy="82" r="11" fill="#2B7FFF"/>
      </g>
    </g>
  </g>
  <!-- Host bottom settings placeholder -->
  <rect x="26" y="788" width="36" height="36" rx="10" fill="#000000" fill-opacity="0.04"/>
  <circle cx="44" cy="806" r="6.5" fill="none" stroke="#63636A" stroke-width="1.5"/>

  <!-- Abstract Muse Chat Canvas (x=72..1264, y=48..844) -->
  <rect x="460" y="88" width="360" height="16" rx="8" fill="#E6E4DE"/>
  <rect x="460" y="124" width="680" height="84" rx="16" fill="#FFFFFF"/>
  <rect x="484" y="146" width="340" height="10" rx="5" fill="#E6E4DE"/>
  <rect x="484" y="166" width="480" height="10" rx="5" fill="#E6E4DE"/>
  <rect x="484" y="186" width="240" height="10" rx="5" fill="#E6E4DE"/>

  <rect x="680" y="228" width="460" height="64" rx="16" fill="#FFFFFF"/>
  <rect x="704" y="250" width="300" height="10" rx="5" fill="#E6E4DE"/>
  <rect x="704" y="270" width="190" height="10" rx="5" fill="#E6E4DE"/>

  <!-- Subtle backdrop dimming over chat canvas when drawer is open -->
  <path d="M 72 48 H 1264 V 832 C 1264 838.627 1258.63 844 1252 844 H 72 V 48 Z" fill="#000000" fill-opacity="0.12"/>

  <!-- 3. Primary Settings Drawer (.mwh-drawer: left=var(--mwh-rail)=56px -> x=72; top=12.5vh -> y=148; height=75vh -> h=596; w=336; rx=20) -->
  <g transform="translate(72, 148)" filter="url(#panelShadow)">
    <rect width="336" height="596" rx="20" fill="#EFECE6"/>
    <rect x="0.5" y="0.5" width="335" height="595" rx="19.5" stroke="#000000" stroke-opacity="0.06"/>

    <!-- Drawer Header (56px high) -->
    <line x1="0" y1="56" x2="336" y2="56" stroke="#000000" stroke-opacity="0.06"/>
    <!-- SVG_LOGO (36x36 at x=16, y=10) -->
    <g transform="translate(16, 10) scale(0.3)">
